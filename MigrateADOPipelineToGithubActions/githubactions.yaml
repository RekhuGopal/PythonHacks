name: "Synthdatagen-Pipeline"

############################################################
# TRIGGERS
############################################################

on:
  workflow_dispatch:
    inputs:

      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prd


############################################################
# GLOBAL PERMISSIONS
############################################################

permissions:
  contents: read
  pull-requests: write
  id-token: write


############################################################
# TERRAFORM PLAN
############################################################

jobs:

  terraform-plan:

    name: "Terraform Plan"

    runs-on: ubuntu-latest

    ########################################################
    # SELECT GITHUB ENVIRONMENT
    #
    # push dev  -> dev
    # push main -> prd
    # PR dev    -> dev
    # PR main   -> prd
    # manual    -> selected environment
    ########################################################

    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event_name == 'pull_request' && (github.base_ref == 'main' && 'prd' || 'dev') || (github.ref == 'refs/heads/main' && 'prd' || 'dev') }}

    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.action == 'plan' ||
          inputs.action == 'apply'
        )
      )

    defaults:
      run:
        working-directory: ./infracicd
        shell: bash

    env:

      AWS_REGION: ${{ secrets.AWS_REGION }}

      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

      TF_VAR_environment: ${{ secrets.ENV }}

      TF_VARS_FILE: ${{ secrets.ENV == 'prd' && 'variablevalues.tfvars' || 'variablevaluesnpd.tfvars' }}

    steps:

      ######################################################
      # CHECKOUT
      ######################################################

      - name: Checkout Source Code
        uses: actions/checkout@v4

      ######################################################
      # SHOW GITHUB REPOSITORY IDENTITY
      ######################################################
      - name: Show GitHub Repository Identity
        run: |
          echo "Repository       : ${{ github.repository }}"
          echo "Repository ID    : ${{ github.repository_id }}"
          echo "Repository Owner : ${{ github.repository_owner }}"
          echo "Owner ID         : ${{ github.repository_owner_id }}"
          echo "Ref              : ${{ github.ref }}"
          echo "Event            : ${{ github.event_name }}"

      ######################################################
      # SHOW OIDC CLAIMS
      ######################################################
      - name: Debug OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('=== OIDC CLAIMS ===');
            console.log('sub:', payload.sub);
            console.log('aud:', payload.aud);
            console.log('repository:', payload.repository);
            console.log('repository_id:', payload.repository_id);
            console.log('repository_owner:', payload.repository_owner);
            console.log('repository_owner_id:', payload.repository_owner_id);
            console.log('ref:', payload.ref);
            console.log('event_name:', payload.event_name);

      ######################################################
      # SHOW DEPLOYMENT INFORMATION
      ######################################################

      - name: Show Deployment Information
        run: |

          echo "=========================================="
          echo "Deployment Information"
          echo "=========================================="

          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Event      : ${{ github.event_name }}"
          echo "Actor      : ${{ github.actor }}"

          echo "Environment : ${{ secrets.ENV }}"
          echo "AWS Region  : ${{ secrets.AWS_REGION }}"

          echo "=========================================="


      ######################################################
      # AWS OIDC
      ######################################################

      - name: Configure AWS Credentials - OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::357171621133:role/github-oidc-role
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActionsTerraformPlan
          mask-aws-account-id: true


      ######################################################
      # VERIFY AWS
      ######################################################

      - name: Verify AWS Authentication
        run: |

          echo "=========================================="
          echo "AWS Identity"
          echo "=========================================="

          aws sts get-caller-identity


      ######################################################
      # PYTHON
      ######################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "backend/requirements.txt"


      ######################################################
      # INSTALL PACKAGING DEPENDENCIES
      ######################################################

      - name: Install Packaging Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install boto3


      ######################################################
      # TERRAFORM
      ######################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false


      ######################################################
      # BUILD LAMBDA PACKAGE
      ######################################################

      - name: Prepare Lambda Build Package
        run: |

          echo "=========================================="
          echo "Preparing Lambda Build"
          echo "=========================================="

          rm -rf lambda_build

          mkdir -p lambda_build

          pip install \
            -r ../backend/requirements.txt \
            -t lambda_build

          cp -r ../backend/app lambda_build/


      ######################################################
      # TERRAFORM FORMAT
      ######################################################

      - name: Terraform Format Check
        run: |

          terraform fmt -check


      ######################################################
      # TERRAFORM INIT
      ######################################################

      - name: Terraform Init
        run: |

          echo "=========================================="
          echo "Terraform Init"
          echo "=========================================="

          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -backend-config="key=vecsyth/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TFSTATE_DDB_TABLE }}" \
            -backend-config="encrypt=true"


      ######################################################
      # TERRAFORM VALIDATE
      ######################################################

      - name: Terraform Validate
        run: |

          echo "=========================================="
          echo "Terraform Validate"
          echo "=========================================="

          terraform validate -no-color


      ######################################################
      # TERRAFORM PLAN
      ######################################################

      - name: Terraform Plan
        id: terraform-plan
        run: |

          echo "=========================================="
          echo "Terraform Plan"
          echo "=========================================="

          echo "Environment : ${{ secrets.ENV }}"
          echo "Variable File: $TF_VARS_FILE"

          terraform plan \
            -var-file="$TF_VARS_FILE" \
            -out=tfplan \
            -no-color \
            2>&1 | tee plan_output.txt


      ######################################################
      # PLAN SUMMARY
      ######################################################

      - name: Generate Plan Summary
        if: always()
        run: |

          echo "## Terraform Plan" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${{ secrets.ENV }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AWS Region | \`${{ secrets.AWS_REGION }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Event | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terraform | \`1.9.0\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Plan Status | \`${{ steps.terraform-plan.outcome }}\` |" >> "$GITHUB_STEP_SUMMARY"


      ######################################################
      # UPLOAD EXACT PLAN
      ######################################################

      - name: Upload Terraform Plan
        if: steps.terraform-plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            ./infracicd/tfplan
            ./infracicd/plan_output.txt
          retention-days: 3


      ######################################################
      # COMMENT PLAN ON PR
      ######################################################

      - name: Comment Terraform Plan on Pull Request
        if: |
          github.event_name == 'pull_request' &&
          steps.terraform-plan.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TOKEN }}
          script: |

            const fs = require('fs');

            const planPath = './infracicd/plan_output.txt';

            let planText = 'No Terraform plan output found.';

            if (fs.existsSync(planPath)) {
              planText = fs.readFileSync(planPath, 'utf8');
            }

            const maxLength = 60000;

            if (planText.length > maxLength) {
              planText =
                planText.substring(0, maxLength) +
                '\n\n...[Terraform plan truncated]...';
            }

            const body = `
            ## Terraform Plan

            **Environment:** \`${{ secrets.ENV }}\`

            **AWS Region:** \`${{ secrets.AWS_REGION }}\`

            **Branch:** \`${{ github.head_ref }}\`

            **Actor:** @${{ github.actor }}

            **Status:** \`${{ steps.terraform-plan.outcome }}\`

            <details>
            <summary>Show Terraform Plan</summary>

            \`\`\`terraform
            ${planText}
            \`\`\`

            </details>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });


############################################################
# TERRAFORM APPLY
############################################################

  terraform-apply:

    name: "Terraform Apply"

    runs-on: ubuntu-latest

    needs:
      - terraform-plan

    ########################################################
    # APPLY ONLY:
    #
    # 1. main push
    # 2. manual action=apply
    ########################################################

    if: |
      needs.terraform-plan.result == 'success' &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'apply'
        )
      )

    ########################################################
    # ENVIRONMENT APPROVAL
    #
    # For main -> prd
    # For manual -> selected environment
    #
    # Configure Required Reviewers in the GitHub
    # Environment settings.
    ########################################################

    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prd' }}

    defaults:
      run:
        working-directory: ./infracicd
        shell: bash

    env:

      AWS_REGION: ${{ secrets.AWS_REGION }}

      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

      TF_VAR_environment: ${{ secrets.ENV }}

      TF_VARS_FILE: ${{ secrets.ENV == 'prd' && 'variablevalues.tfvars' || 'variablevaluesnpd.tfvars' }}

    steps:

      ######################################################
      # CHECKOUT
      ######################################################

      - name: Checkout Source Code
        uses: actions/checkout@v4


      ######################################################
      # SHOW ENVIRONMENT
      ######################################################

      - name: Show Apply Environment
        run: |

          echo "=========================================="
          echo "Terraform Apply"
          echo "=========================================="

          echo "Environment : ${{ secrets.ENV }}"
          echo "AWS Region  : ${{ secrets.AWS_REGION }}"
          echo "Branch      : ${{ github.ref_name }}"
          echo "Actor       : ${{ github.actor }}"

          echo "=========================================="


      ######################################################
      # AWS OIDC
      ######################################################

      - name: Configure AWS Credentials - OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::357171621133:role/github-oidc-role
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActionsTerraformApply
          mask-aws-account-id: true


      ######################################################
      # VERIFY AWS
      ######################################################

      - name: Verify AWS Authentication
        run: |

          aws sts get-caller-identity


      ######################################################
      # PYTHON
      ######################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "backend/requirements.txt"


      ######################################################
      # INSTALL DEPENDENCIES
      ######################################################

      - name: Install Packaging Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install boto3


      ######################################################
      # TERRAFORM
      ######################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false


      ######################################################
      # BUILD LAMBDA PACKAGE
      ######################################################

      - name: Prepare Lambda Build Package
        run: |

          rm -rf lambda_build

          mkdir -p lambda_build

          pip install \
            -r ../backend/requirements.txt \
            -t lambda_build

          cp -r ../backend/app lambda_build/


      ######################################################
      # TERRAFORM INIT
      ######################################################

      - name: Terraform Init
        run: |

          echo "=========================================="
          echo "Terraform Init"
          echo "=========================================="

          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -backend-config="key=vecsyth/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TFSTATE_DDB_TABLE }}" \
            -backend-config="encrypt=true"


      ######################################################
      # DOWNLOAD EXACT PLAN
      ######################################################

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: ./infracicd


      ######################################################
      # TERRAFORM APPLY
      ######################################################

      - name: Terraform Apply
        run: |

          echo "=========================================="
          echo "Terraform Apply"
          echo "=========================================="

          echo "Environment : ${{ secrets.ENV }}"
          echo "Applying : tfplan"

          terraform apply \
            -auto-approve \
            tfplan

      ######################################################
      # APPLY SUMMARY
      ######################################################

      - name: Generate Apply Summary
        if: always()
        run: |

          echo "## Terraform Apply" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${{ secrets.ENV }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AWS Region | \`${{ secrets.AWS_REGION }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | \`${{ job.status }}\` |" >> "$GITHUB_STEP_SUMMARY"
